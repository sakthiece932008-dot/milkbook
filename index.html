async function initialize(){

async function save(change){

  if(!ready)return false;
  const snapshot=hosted?await readServer():{state:JSON.parse(localStorage.getItem(key)||JSON.stringify(db))};

  if(change(next)===false)return false;

   if(!await writeServer(next,snapshot.version)){db=(await readServer()).state;note('The ledger changed. Review and try again.');return false}

function monthName(month,lang='en'){
 return new Date(month+'-01T12:00').toLocaleDateString(lang==='ta'?'ta-IN':'en-IN',{month:'long',year:'numeric'});
}
function monthlyLedger(records){
 const months=new Map();
 for(const r of ordered(records)){
  const month=r.date.slice(0,7);
  if(!months.has(month))months.set(month,{month,charges:0,paid:0});
  months.get(month)[r.type==='Milk'?'charges':'paid']+=r.amount;
 }
 let available=sum(records,'Payment'),balance=0;
 return Array.from(months.values(),m=>{
  const applied=Math.min(available,m.charges);
  available-=applied;
  balance+=m.charges-m.paid;
  return {...m,outstanding:m.charges-applied,closing:balance};
 });
}
function monthHistory(records){
 if(!records.length)return '';

}

}
function billLines(b,lang){

  lines.push([monthName(m.month,lang)+' '+t('pending','நிலுவை'),money(m.outstanding)]);

$('lookup').addEventListener('focus',async()=>{
 if(hosted&&ready){try{db=(await readServer()).state}catch{note('Could not refresh customer search.');return}}
 updateSearch();
});
document.addEventListener('click',e=>{if(!e.target.closest('.lookup'))$('results').hidden=true});
$('lookup').addEventListener('keydown',e=>{if(e.key==='Escape')$('results').hidden=true});
function matchesFor(n){return db.customers.filter(c=>normal(c.name)===normal(n))}
function showMatches(n){
 const matches=matchesFor(n);
 $('matches').innerHTML=matches.length?'<p>Choose the existing account to continue with its ID.</p>'+matches.map(c=>customerButton(c,'resume')).join(''):'';
}
document.addEventListener('input',e=>{if(e.target.form?.id==='newcustomer')showMatches(e.target.value)});
function finishCustomer(id,message){
 $('dlg').close();$('lookup').value='';$('results').hidden=true;
 if(sourceForm?.isConnected){document.querySelectorAll('select[name=customer]').forEach(x=>x.innerHTML=opts(x.form===sourceForm?id:x.value))}
 else render();
 note(message);sourceForm=null;
}
async function createCustomer(value,confirmed){
 const n=value.trim();if(!n){note('Enter a customer name.');return}
 const id=uid();let conflicts=false;
 const saved=await save(state=>{
  if(!confirmed&&state.customers.some(c=>normal(c.name)===normal(n))){db=state;conflicts=true;return false}
  state.customers.push({id,name:n,createdAt:new Date().toISOString()});
 });
 if(conflicts){modal('<h2>Customer name already exists</h2><p>Continue with an account below, or confirm this is a different person to assign a new ID.</p>'+matchesFor(n).map(c=>customerButton(c,'resume')).join('')+'<button class="btn" data-newname="'+esc(n)+'">Confirm new customer</button>');return}
 if(saved)finishCustomer(id,'Customer added · '+db.customers.find(c=>c.id===id).number);
}
async function resumeCustomer(id){
 if(!await save(state=>{const c=state.customers.find(c=>c.id===id);if(!c)return false;c.removed=false;delete c.archivedAt}))return;
 finishCustomer(id,'Continuing with '+label(db.customers.find(c=>c.id===id)));
}
function showProfile(id){
 const c=db.customers.find(c=>c.id===id);if(!c)return;
 $('results').hidden=true;
 const rows=ordered(db.records.filter(r=>r.customer===id)),balance=bal(rows);
 modal('<h2>'+esc(label(c))+'</h2><p>'+(c.removed?'Archived account':'Active account')+(c.archivedAt?' · '+display(localDate(new Date(c.archivedAt))):'')+'</p><div class="totals">'+metric(balanceLabel(balance),money(Math.abs(balance)))+'</div>'+monthHistory(rows)+table(rows)+(c.removed?'<button class="btn" data-resume="'+id+'">Resume this customer ID</button>':''));
}
let removalBalance;
function confirmRemoval(id){
 const c=db.customers.find(c=>c.id===id);if(!c)return;
 removalBalance=bal(db.records.filter(r=>r.customer===id));
 const warning=removalBalance>0?'This customer owes you '+money(removalBalance)+'.':removalBalance<0?'You owe this customer '+money(-removalBalance)+' in surplus credit.':'This account is settled.';
 modal('<h2>Remove '+esc(label(c))+'?</h2><div '+(removalBalance?'class="warning" role="alert"':'')+'><strong>'+(removalBalance?'⚠ ':'')+warning+'</strong></div><p>This removes the account from daily entries, history and bills. Its records stay in the archive, searchable by name or ID.</p><button class="btn danger" data-confirm="'+id+'">Confirm removal</button>');
}
async function archiveCustomer(id){
 let changed=false;
 const saved=await save(state=>{
  const c=state.customers.find(c=>c.id===id);if(!c)return false;
  if(removalBalance!==bal(state.records.filter(r=>r.customer===id))){db=state;changed=true;return false}
  c.removed=true;c.archivedAt=new Date().toISOString();
 });
 if(changed){confirmRemoval(id);note('Balance changed. Review before removing.');return}
 if(saved){$('dlg').close();$('lookup').value='';$('results').hidden=true;render();note('Customer moved to archive')}
}

document.addEventListener('click',async e=>{const b=e.target.closest('button');if(b!==$('toggle')){$('menu').hidden=true;$('toggle').setAttribute('aria-expanded','false')}if(!b)return;const d=b.dataset;if(d.page!==undefined){page=+d.page;render()}if(d.close!==undefined)$('dlg').close();if(d.add!==undefined){sourceForm=b.closest('form');openAdd()}
 if(d.remove)confirmRemoval(d.remove);
 if(d.confirm)await archiveCustomer(d.confirm);
 if(d.profile){sourceForm=null;showProfile(d.profile)}
 if(d.resume)await resumeCustomer(d.resume);
 if(d.newname)await createCustomer(d.newname,true);
 if(d.shift){b.form.elements.shift.value=d.shift;b.parentElement.querySelectorAll('button').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))})}if(d.edit){const r=db.records.find(x=>x.id===d.edit);modal('<h2>Edit '+r.type.toLowerCase()+' entry</h2>'+form(r.type,r))}if(b.id==='download')downloadBill();if(b.id==='downloadAll')downloadBill(true)});
document.addEventListener('change',e=>{const {name:n,value:v}=e.target;if(n==='day')day=v;else if(n==='history')historyId=v;else if(n==='billCustomer')billCustomer=v;else if(n==='from')from=v;else if(n==='to')to=v;else if(n==='language')language=v;else return;render()});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,data=Object.fromEntries(new FormData(f));if(f.id==='newcustomer'){await createCustomer(data.name,false);return}
const old=db.records.find(r=>r.id===f.dataset.id),r={id:old?.id||uid(),created:old?.created||new Date().toISOString(),updated:new Date().toISOString(),customer:data.customer,date:data.date,type:f.dataset.type,amount:Math.round(+data.amount*100),quantity:+data.quantity||0,shift:data.shift||''};if(!await save(s=>saveRecord(s,r,f)))return;f.querySelector('[data-duplicate]')?.remove();if($('dlg').open)$('dlg').close();if(page===0){f.elements.amount.value='';const last=$('app').lastElementChild;last.querySelector('.tablewrap,.empty').outerHTML=table(ordered(activeRecords().filter(x=>x.date===localDate())).reverse())}else render();note(old?'Changes saved':r.type==='Milk'?'Milk entry saved':'Payment recorded')});
</script>
<script>
function renderBillPages(customer,b,pages){
 const tamil=language==='ta',t=(en,ta)=>tamil?ta:en;
 const rows=b.rows.map(r=>[r.date,r.type==='Payment'?t('Payment','செலுத்தியது'):r.shift==='Morning'?t('Morning','காலை'):t('Evening','மாலை'),r.quantity?(String(r.quantity)+' '+t('L','லி')):'—',r.type==='Milk'?money(r.amount):'—',r.type==='Payment'?money(r.amount):'—']);
 const summary=billLines(b,language);
 const remaining=b.closingMonths.filter(m=>m.outstanding);
 if(!tamil&&remaining.length)summary.push([t('Pending by month at period end','கால இறுதியில் மாத வாரியான நிலுவை'),''],...remaining.map(m=>[monthName(m.month,language),money(m.outstanding)]));
 const sheets=[];
 for(let j=0;j<rows.length;j+=23)sheets.push({kind:'entries',items:rows.slice(j,j+23)});
 const last=sheets[sheets.length-1];
 if(last&&last.items.length+summary.length+2<=23)last.summary=summary;
 else for(let j=0;j<summary.length;j+=23)sheets.push({kind:'summary',items:summary.slice(j,j+23)});
 const count=sheets.length;
 for(let i=0;i<count;i++){
 const c=document.createElement('canvas');c.width=1240;c.height=1754;const g=c.getContext('2d');g.fillStyle='white';g.fillRect(0,0,c.width,c.height);
 function line(s,x,y,size=28,width=1090){g.fillStyle='#173c2b';g.font=size+'px "Nirmala UI","Noto Sans Tamil",sans-serif';g.fillText(s,x,y,width)}
 line(t('Milkbook · Milk bill','மில்க்புக் · பால் கட்டணப் பட்டியல்'),70,110,46);
 line(t('Customer','வாடிக்கையாளர்')+'  '+label(customer),70,182);
 line(t('Billing period','கட்டணக் காலம்')+'  '+from+'  —  '+to,70,240);
 const xs=[70,310,570,745,975],widths=[220,240,154,208,200];
 function cells(a,y){a.forEach((s,j)=>line(s,xs[j],y,25,widths[j]))}
 const sheet=sheets[i];
 function summaryAt(items,y){
  line(t('Bill calculation','கட்டணக் கணக்கீடு'),70,y,32);
  items.forEach(([label,value],j)=>{line(label,70,y+56+j*53,27,760);line(value,875,y+56+j*53,27,300)});
 }
 if(sheet.kind==='entries'){
  g.fillStyle='#e8f2e9';g.fillRect(55,285,1130,63);cells([t('Date','தேதி'),t('Entry','பதிவு'),t('Quantity','அளவு'),t('Charge','கட்டணம்'),t('Paid','செலுத்தியது')],327);
  sheet.items.forEach((r,j)=>{cells(r,395+j*51);g.fillStyle='#dde5de';g.fillRect(60,410+j*51,1120,1)});
  if(sheet.summary)summaryAt(sheet.summary,425+sheet.items.length*51);
 }else summaryAt(sheet.items,327); line(t('Page','பக்கம்')+' '+(i+1)+' / '+count,70,1705,22);
 pages.push(Uint8Array.from(atob(c.toDataURL('image/jpeg',.92).split(',')[1]),ch=>ch.charCodeAt(0)));
 c.width=c.height=0;
 }
}
function downloadBill(all=false){
 const pages=[];
 if(all){
  const byCustomer=new Map();
  for(const record of db.records){
   if(record.date>to)continue;
   if(!byCustomer.has(record.customer))byCustomer.set(record.customer,[]);
   byCustomer.get(record.customer).push(record);
  }
  const customers=db.customers.slice().sort((a,b)=>a.name.localeCompare(b.name));
  for(const customer of customers){
   const bill=statement(customer.id,byCustomer.get(customer.id)||[]);
   if(customer.removed)continue;
   renderBillPages(customer,bill,pages);
  }
 }else{
  const customer=db.customers.find(c=>c.id===billCustomer);
  if(customer)renderBillPages(customer,statement(),pages);
 }
 if(!pages.length){note('No customers to bill for these dates.');return}
 const count=pages.length;
 const enc=new TextEncoder(),parts=[],offsets=[0];let length=0;
 function add(v){const a=typeof v==='string'?enc.encode(v):v;parts.push(a);length+=a.length}
 function obj(id,body){offsets[id]=length;add(id+' 0 obj\n');add(body);add('\nendobj\n')}
 add('%PDF-1.4\n');obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Count '+count+' /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>');
 pages.forEach((img,i)=>{const id=3+i*3;obj(id,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im '+(id+1)+' 0 R >> >> /Contents '+(id+2)+' 0 R >>');offsets[id+1]=length;add((id+1)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width 1240 /Height 1754 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+img.length+' >>\nstream\n');add(img);add('\nendstream\nendobj\n');const draw='q 595 0 0 842 0 0 cm /Im Do Q\n';obj(id+2,'<< /Length '+draw.length+' >>\nstream\n'+draw+'endstream')});
 const start=length;add('xref\n0 '+offsets.length+'\n0000000000 65535 f \n');offsets.slice(1).forEach(n=>add(String(n).padStart(10,'0')+' 00000 n \n'));add('trailer\n<< /Size '+offsets.length+' /Root 1 0 R >>\nstartxref\n'+start+'\n%%EOF');
 const url=URL.createObjectURL(new Blob(parts,{type:'application/pdf'})),a=document.createElement('a');a.href=url;a.download='Milkbook-'+(all?'All-customers':name(billCustomer))+'-'+from+'-'+to+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
initialize();
