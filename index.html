const $=id=>document.getElementById(id), key='milkbook-ledger-v1', esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>crypto.randomUUID(), localDate=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),money=p=>'₹'+(p/100).toLocaleString('en-IN',{minimumFractionDigits:2}),display=d=>new Date(d+'T12:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

const pages=['Milk entry','Customers','Edit entries','View entries','Customer history','Calculate bill','Settings'],subs=['Record milk deliveries and customer payments.','Manage customers in your dairy ledger.','Update a milk delivery or payment.','Review deliveries and payments for a selected date.','Follow charges, payments and balances for each customer.','Prepare an itemised bill for a custom date range.','Manage dairy contact details, milk price and payment QR.'];
function note(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,3500)}
const hosted=location.protocol==='https:';
let revision='',ready=!hosted;
function assignNumbers(state){
 let last=state.customers.reduce((n,c)=>Math.max(n,Number(c.number)||0),0);
 for(const c of state.customers)if(!c.number){
  if(last>=99999)throw Error('All five-digit customer IDs have been assigned.');
  c.number=String(++last).padStart(5,'0');
 }
 return state;
}
function label(c){return c.name+' · '+c.number}
function normal(s){return s.trim().normalize('NFKC').replace(/\s+/g,' ').toLocaleLowerCase()}
async function readServer(){
 const res=await fetch('/api/ledger',{cache:'no-store'});
 if(!res.ok)throw Error('Customer storage unavailable');
 return res.json();
}
async function writeServer(state,version){
 const res=await fetch('/api/ledger',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version,state})});
 if(res.status===409)return false;
 if(!res.ok)throw Error('Could not save to customer storage');
 revision=(await res.json()).version;
 return true;
}
async function initialize(){
 if(!hosted){assignNumbers(db);localStorage.setItem(key,JSON.stringify(db));render();return}
 try{
  const legacy=JSON.parse(localStorage.getItem(key)||'{"customers":[],"records":[]}');
  for(let attempt=0;attempt<5;attempt++){
   const data=await readServer(),state=data.state;
   const importing=!localStorage.getItem(key+'-imported');
   if(importing){
    const ids=new Set(state.customers.map(c=>c.id)),entries=new Set(state.records.map(r=>r.id));
    for(const c of legacy.customers)if(!ids.has(c.id)){const copy={...c};delete copy.number;state.customers.push(copy)}
    for(const r of legacy.records)if(!entries.has(r.id))state.records.push(r);
   }
   const missing=state.customers.some(c=>!c.number);
   assignNumbers(state);
   if((missing||(importing&&legacy.records.length))&&!await writeServer(state,data.version))continue;
   db=state;ready=true;localStorage.setItem(key+'-imported','1');render();return;
  }
  throw Error();
 }catch{$('app').innerHTML='<div class="card"><p>Could not load customer storage. Your existing records are preserved.</p><button class="btn" onclick="initialize()">Retry</button></div>'}
}
async function save(change){
 async function commit(){
  if(!ready)return false;
  const snapshot=hosted?await readServer():{state:JSON.parse(localStorage.getItem(key)||JSON.stringify(db))};
  const next=assignNumbers(snapshot.state);
  if(change(next)===false)return false;
  assignNumbers(next);
  if(hosted){
   if(!await writeServer(next,snapshot.version)){db=(await readServer()).state;note('The ledger changed. Review and try again.');return false}
  }else localStorage.setItem(key,JSON.stringify(next));
  db=next;return true;
 }
 try{return navigator.locks?await navigator.locks.request(key,commit):await commit()}
 catch(error){note(error.message||'Could not save. Try again.');return false}
}
function saveRecord(state,record,form){
 if(record.date>localDate()){note('Choose today or an earlier date.');return false}
 if(!state.customers.some(c=>c.id===record.customer&&!c.removed)){note('Customer is archived. Find the account in search to resume.');return false}
 const duplicate=record.type==='Milk'&&state.records.some(existing=>
  existing.type==='Milk'&&existing.id!==record.id&&existing.customer===record.customer&&
  existing.date===record.date&&existing.shift===record.shift);
 if(duplicate){
  let warning=form.querySelector('[data-duplicate]');
  if(!warning){
   warning=document.createElement('p');
   warning.dataset.duplicate='';
   warning.setAttribute('role','alert');
   form.insertBefore(warning,form.querySelector('.btn'));
  }
  warning.textContent='A '+record.shift.toLowerCase()+' milk entry already exists for '+name(record.customer)+' on '+display(record.date)+'. Use Edit entries to change it.';
  return false;
 }
 const index=state.records.findIndex(existing=>existing.id===record.id);
 if(index<0)state.records.push(record);
 else state.records[index]=record;
 return true;
}window.addEventListener('storage',e=>{if(!hosted&&e.key===key&&e.newValue){db=assignNumbers(JSON.parse(e.newValue));render()}});
const name=id=>db.customers.find(c=>c.id===id)?.name||'',ordered=rs=>rs.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.created.localeCompare(b.created)),sum=(rs,t)=>rs.filter(r=>r.type===t).reduce((a,r)=>a+r.amount,0),bal=rs=>sum(rs,'Milk')-sum(rs,'Payment'),qty=n=>{const a=Math.floor(n),b=['','¼','½','¾'][Math.round((n-a)*4)];return (a||!b?String(a):'')+b+' L'};
function opts(id='',all=false){return '<option value="">Select customer</option>'+db.customers.filter(c=>!c.removed).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>'<option value="'+c.id+'" '+(id===c.id?'selected':'')+'>'+esc(label(c))+'</option>').join('')}

function monthName(month,lang='en'){

function monthlyLedger(records){
 const months=new Map();
 for(const r of ordered(records)){
  const month=r.date.slice(0,7);
  if(!months.has(month))months.set(month,{month,charges:0,paid:0});
  months.get(month)[r.type==='Milk'?'charges':'paid']+=r.amount;
 }
 let available=sum(records,'Payment'),balance=0;
 return Array.from(months.values(),m=>{
  const applied=Math.min(available,m.charges);
  available-=applied;
  balance+=m.charges-m.paid;
  return {...m,outstanding:m.charges-applied,closing:balance};
 });
}
function monthHistory(records){
 if(!records.length)return '';
 const rows=monthlyLedger(records).map(m=>'<tr><td>'+monthName(m.month)+'</td><td>'+money(m.charges)+'</td><td>'+money(m.paid)+'</td><td>'+money(Math.abs(m.closing))+' · '+balanceLabel(m.closing)+'</td><td>'+money(m.outstanding)+'</td></tr>').join('');
 return '<h2>Monthly payment history</h2><p class="muted">Payments settle the oldest charges first. Remaining shows the unpaid milk charges from each month after all recorded payments.</p><div class="tablewrap"><table><thead><tr><th>Month</th><th>Milk charges</th><th>Payments received</th><th>Closing balance</th><th>Remaining</th></tr></thead><tbody>'+rows+'</tbody></table></div><h2 style="margin:22px 0 10px">Entry history</h2>';
}
function statement(customerId=billCustomer, recordsSource=db.records){
 const records=ordered(recordsSource.filter(r=>r.customer===customerId&&r.date<=to));
 const earlier=records.filter(r=>r.date<from),rows=records.filter(r=>r.date>=from);
 const open=bal(earlier),charges=sum(rows,'Milk'),paid=sum(rows,'Payment');
 return {open,rows,charges,paid,close:open+charges-paid,openingMonths:monthlyLedger(earlier),closingMonths:monthlyLedger(records)};
}
function billLines(b,lang){
 const t=(en,ta)=>lang==='ta'?ta:en,lines=[];
 for(const m of b.openingMonths.filter(m=>m.outstanding)){
  lines.push([monthName(m.month,lang)+' '+t('pending','நிலுவை'),money(m.outstanding)]);
 }

 lines.push([t('Milk charges for current bill','இந்த பில்லுக்கான பால் கட்டணம்'),money(b.charges)],
  [t('Total amount','மொத்தத் தொகை'),money(gross)]);
 if(credit)lines.push([t('Less surplus credit brought forward','கழிக்கப்படும் முந்தைய உபரித் தொகை'),'− '+money(credit)]);
 lines.push([t('Amount paid','செலுத்தப்பட்ட தொகை'),money(b.paid)]);

  items.forEach(([label,value],j)=>{line(label,70,y+56+j*53,27,760);line(value,875,y+56+j*53,27,300)});
 }
 if(sheet.kind==='entries'){
  g.fillStyle='#e8f2e9';g.fillRect(55,285,1130,63);cells([t('Date','தேதி'),t('Entry','பதிவு'),t('Quantity','அளவு'),t('Charge','கட்டணம்'),t('Paid','செலுத்தியது')],327);
  sheet.items.forEach((r,j)=>{cells(r,395+j*51);g.fillStyle='#dde5de';g.fillRect(60,410+j*51,1120,1)});
  if(sheet.summary)summaryAt(sheet.summary,425+sheet.items.length*51);
 }else summaryAt(sheet.items,327); g.restore();
 if(images.qr&&i===count-1){
  const scale=Math.min(300/images.qr.width,300/images.qr.height),w=images.qr.width*scale,h=images.qr.height*scale;
  g.imageSmoothingEnabled=false;g.drawImage(images.qr,(c.width-w)/2,1510-h/2,w,h);
  g.save();g.textAlign='center';line(t('Pay by UPI','UPI மூலம் செலுத்த'),c.width/2,1699,25);g.restore();
 }
 line(t('Page','பக்கம்')+' '+(i+1)+' / '+count,70,1705,22);
 pages.push(Uint8Array.from(atob(c.toDataURL('image/jpeg',.92).split(',')[1]),ch=>ch.charCodeAt(0)));
 c.width=c.height=0;
 }
}
async function downloadBill(all=false){
 let images;try{images={logo:await imageReady($('farmLogo').src),qr:settings().qr?await imageReady(settings().qr):null}}catch{note('Could not load the bill images. Check the payment QR in Settings.');return}
 const pages=[];
 if(all){
  const byCustomer=new Map();
  for(const record of db.records){
   if(record.date>to)continue;
   if(!byCustomer.has(record.customer))byCustomer.set(record.customer,[]);
   byCustomer.get(record.customer).push(record);
  }
  const customers=db.customers.slice().sort((a,b)=>a.name.localeCompare(b.name));
  for(const customer of customers){
   const bill=statement(customer.id,byCustomer.get(customer.id)||[]);
   if(customer.removed)continue;
   renderBillPages(customer,bill,pages,images);
  }
 }else{
  const customer=db.customers.find(c=>c.id===billCustomer);
  if(customer)renderBillPages(customer,statement(),pages,images);
 }
 if(!pages.length){note('No customers to bill for these dates.');return}
 const count=pages.length;
 const enc=new TextEncoder(),parts=[],offsets=[0];let length=0;
 function add(v){const a=typeof v==='string'?enc.encode(v):v;parts.push(a);length+=a.length}
 function obj(id,body){offsets[id]=length;add(id+' 0 obj\n');add(body);add('\nendobj\n')}
 add('%PDF-1.4\n');obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Count '+count+' /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>');
 pages.forEach((img,i)=>{const id=3+i*3;obj(id,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im '+(id+1)+' 0 R >> >> /Contents '+(id+2)+' 0 R >>');offsets[id+1]=length;add((id+1)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width 1240 /Height 1754 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+img.length+' >>\nstream\n');add(img);add('\nendstream\nendobj\n');const draw='q 595 0 0 842 0 0 cm /Im Do Q\n';obj(id+2,'<< /Length '+draw.length+' >>\nstream\n'+draw+'endstream')});
 const start=length;add('xref\n0 '+offsets.length+'\n0000000000 65535 f \n');offsets.slice(1).forEach(n=>add(String(n).padStart(10,'0')+' 00000 n \n'));add('trailer\n<< /Size '+offsets.length+' /Root 1 0 R >>\nstartxref\n'+start+'\n%%EOF');
 const url=URL.createObjectURL(new Blob(parts,{type:'application/pdf'})),a=document.createElement('a');a.href=url;a.download='Milkbook-'+(all?'All-customers':name(billCustomer))+'-'+from+'-'+to+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
initialize();
</script></body></html>
